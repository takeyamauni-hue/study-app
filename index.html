<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高2スタディ・クエスト！ - まるぷー版</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1p:wght@400;700;900&display=swap');
        body { font-family: 'M PLUS Rounded 1p', sans-serif; }
    </style>
</head>
<body class="bg-indigo-950 text-slate-100 min-h-screen pb-12 selection:bg-pink-500 selection:text-white">

    <div id="app" class="max-w-md mx-auto p-4 space-y-6">
        <!-- ヘッダー -->
        <header class="bg-gradient-to-r from-purple-600 to-pink-600 rounded-3xl p-5 shadow-lg border-b-4 border-pink-400 text-center relative overflow-hidden">
            <div class="absolute -right-6 -bottom-6 text-white/10 text-8xl font-black">2nd</div>
            <h1 class="text-2xl font-black tracking-wider flex items-center justify-center gap-2 drop-shadow">
                <i class="fa-solid fa-dog text-yellow-300 animate-bounce"></i> まるぷースタディ・クエスト
            </h1>
            <p class="text-xs text-pink-100 mt-1 font-bold">高2ラストスパート！3月末コンプリート計画</p>
            
            <div id="countdown-badge" class="mt-3 inline-block bg-black/30 px-4 py-1 rounded-full text-xs font-bold text-yellow-300 border border-yellow-300/40">
                3月末まで あと -- 日
            </div>
        </header>

        <!-- 本日のキャラ＆モードカード -->
        <section class="bg-slate-900/90 border-2 border-purple-500/50 rounded-3xl p-5 shadow-xl relative">
            <div class="flex justify-between items-center mb-3">
                <span class="text-xs font-bold uppercase tracking-wider text-purple-300 bg-purple-950 px-3 py-1 rounded-full border border-purple-700">
                    <i class="fa-solid fa-calendar-day mr-1"></i> 本日のモード
                </span>
                <select id="mode-selector" onchange="changeMode(this.value)" class="bg-slate-800 text-xs font-bold text-yellow-300 border border-yellow-300/40 rounded-xl px-3 py-1.5 focus:outline-none cursor-pointer">
                    <option value="auto">🤖 自動判定モード</option>
                    <option value="school_club">🔥 平日部活（3h）</option>
                    <option value="school_noclub">⚡ 平日部活なし（5h）</option>
                    <option value="holiday_club">🎾 休日部活あり（5h）</option>
                    <option value="holiday_noclub">🌟 休日部活なし（7h）</option>
                    <option value="holiday_play">🎮 休日遊び（5h）</option>
                </select>
            </div>

            <div id="today-chara-status" class="bg-slate-800/90 p-4 rounded-2xl border border-pink-500/40 flex items-center gap-4 mb-4">
                <div id="chara-icon" class="text-4xl">🐕</div>
                <div>
                    <div id="chara-title" class="text-xs font-bold text-yellow-300">今日のまるぷー</div>
                    <div id="chara-message" class="text-sm font-black text-pink-200 mt-0.5">今日もコツコツ頑張ろう！</div>
                </div>
            </div>

            <div id="today-mode-banner" class="text-xs font-bold text-pink-300 mb-4 bg-pink-950/40 p-2 rounded-xl border border-pink-500/30 text-center">
                判定中...
            </div>
        </section>

        <!-- カレンダー＆達成度表示 -->
        <section class="bg-slate-900/90 border-2 border-indigo-500/50 rounded-3xl p-5 shadow-xl space-y-3">
            <div class="flex justify-between items-center">
                <span class="text-sm font-black text-indigo-300"><i class="fa-solid fa-calendar-days text-yellow-400 mr-1"></i> 達成度カレンダー（直近7日）</span>
            </div>
            <div id="calendar-container" class="grid grid-cols-7 gap-1 text-center">
                <!-- 動的生成 -->
            </div>
            <div class="flex justify-between items-center pt-2 border-t border-slate-800 text-xs text-slate-400">
                <span><span class="text-yellow-400">✨</span> 金:全クリア</span>
                <span><span class="text-slate-300">🥈</span> 銀:半分</span>
                <span><span class="text-blue-400">💤</span> 青:未達成</span>
            </div>
        </section>

        <!-- 科目タブ切り替え -->
        <div class="flex gap-2 overflow-x-auto pb-1">
            <button onclick="switchTab('math1a')" id="tab-math1a" class="flex-1 py-2.5 px-3 rounded-2xl font-bold text-xs bg-purple-600 text-white shadow-lg transition whitespace-nowrap">数Ⅰ+A</button>
            <button onclick="switchTab('math2bc')" id="tab-math2bc" class="flex-1 py-2.5 px-3 rounded-2xl font-bold text-xs bg-slate-800 text-slate-300 hover:bg-slate-700 transition whitespace-nowrap">数Ⅱ·B·C</button>
            <button onclick="switchTab('physics')" id="tab-physics" class="flex-1 py-2.5 px-3 rounded-2xl font-bold text-xs bg-slate-800 text-slate-300 hover:bg-slate-700 transition whitespace-nowrap">物理</button>
            <button onclick="switchTab('chemistry')" id="tab-chemistry" class="flex-1 py-2.5 px-3 rounded-2xl font-bold text-xs bg-slate-800 text-slate-300 hover:bg-slate-700 transition whitespace-nowrap">化学</button>
            <button onclick="switchTab('words')" id="tab-words" class="flex-1 py-2.5 px-3 rounded-2xl font-bold text-xs bg-slate-800 text-slate-300 hover:bg-slate-700 transition whitespace-nowrap">単語</button>
        </div>

        <!-- メインコンテンツ領域 -->
        <main id="main-content" class="space-y-4">
            <!-- JavaScriptで動的描画 -->
        </main>
    </div>

    <script>
        const defaultData = {
            manualMode: 'auto',
            words: { englishTotal: 0, classicalTotal: 0 },
            dailyLog: {}, // "YYYY-MM-DD": count
            subjects: {
                math1a: {
                    name: "青チャート：数Ⅰ+A",
                    categories: [
                        { id: "m1a_1", title: "数と式・集合と命題", count: 40 },
                        { id: "m1a_2", title: "2次関数", count: 45 },
                        { id: "m1a_3", title: "図形と計量・データ", count: 45 },
                        { id: "m1a_4", title: "場合の数と確率・整数", count: 50 }
                    ],
                    status: {}, // key: "id_index": {st: 0~2, date: "12/5"}
                },
                math2bc: {
                    name: "青チャート：数Ⅱ・B・C",
                    categories: [
                        { id: "m2bc_1", title: "式と証明・複素数と方程式", count: 35 },
                        { id: "m2bc_2", title: "図形と方程式・三角関数", count: 45 },
                        { id: "m2bc_3", title: "指数・対数・微分積分", count: 45 },
                        { id: "m2bc_4", title: "数列・統計的な推測・ベクトル", count: 50 }
                    ],
                    status: {}
                },
                physics: {
                    name: "リードα：物理",
                    categories: [
                        { id: "p_1", title: "力学", count: 130 },
                        { id: "p_2", title: "熱力学・波動", count: 180 },
                        { id: "p_3", title: "電磁気・原子", count: 150 }
                    ],
                    status: {}
                },
                chemistry: {
                    name: "リードα：化学",
                    categories: [
                        { id: "c_1", title: "理論化学", count: 210 },
                        { id: "c_2", title: "無機・有機化学", count: 220 }
                    ],
                    status: {}
                }
            }
        };

        let appData = JSON.parse(localStorage.getItem('study_quest_data_v3')) || defaultData;
        let currentTab = 'math1a';

        function saveData() {
            localStorage.setItem('study_quest_data_v3', JSON.stringify(appData));
            render();
        }

        function getTodayStr() {
            const d = new Date();
            return `${d.getMonth() + 1}/${d.getDate()}`;
        }

        function getTodayYMD() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }

        function getTodayModeInfo() {
            if (appData.manualMode && appData.manualMode !== 'auto') {
                const map = {
                    school_club: { name: "🔥 平日部活モード", hours: "3時間" },
                    school_noclub: { name: "⚡ 平日部活なしモード", hours: "5時間" },
                    holiday_club: { name: "🎾 休日部活ありモード", hours: "5時間" },
                    holiday_noclub: { name: "🌟 休日部活なしモード", hours: "7時間" },
                    holiday_play: { name: "🎮 休日遊びモード", hours: "5時間" }
                };
                return map[appData.manualMode];
            }
            const dayOfWeek = new Date().getDay();
            if (dayOfWeek === 2) return { name: "⚡ 平日部活なしモード (火曜)", hours: "5時間" };
            if (dayOfWeek === 6) return { name: "🎾 休日部活ありモード (土曜)", hours: "5時間" };
            if (dayOfWeek === 0) return { name: "🌟 休日部活なしモード (日曜)", hours: "7時間" };
            return { name: "🔥 平日部活モード", hours: "3時間" };
        }

        function changeMode(val) {
            appData.manualMode = val;
            saveData();
        }

        function switchTab(tab) {
            currentTab = tab;
            ['math1a', 'math2bc', 'physics', 'chemistry', 'words'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if (t === tab) {
                    btn.className = "flex-1 py-2.5 px-3 rounded-2xl font-bold text-xs bg-purple-600 text-white shadow-lg transition whitespace-nowrap";
                } else {
                    btn.className = "flex-1 py-2.5 px-3 rounded-2xl font-bold text-xs bg-slate-800 text-slate-300 hover:bg-slate-700 transition whitespace-nowrap";
                }
            });
            render();
        }

        function cycleStatus(subjectKey, catId, idx) {
            const key = `${catId}_${idx}`;
            let currentObj = appData.subjects[subjectKey].status[key] || { st: 0, date: "" };
            let nextSt = (currentObj.st + 1) % 3; // 0:未 -> 1:△ -> 2:〇 -> 0
            let todayStr = getTodayStr();
            
            appData.subjects[subjectKey].status[key] = {
                st: nextSt,
                date: nextSt > 0 ? todayStr : ""
            };

            // デイリーログのカウント更新
            let todayYMD = getTodayYMD();
            let completedCount = 0;
            Object.keys(appData.subjects).forEach(sK => {
                Object.values(appData.subjects[sK].status).forEach(item => {
                    if (item.st === 2 && item.date === todayStr) completedCount++;
                });
            });
            appData.dailyLog[todayYMD] = completedCount;

            saveData();
        }

        function addWords(type, amount) {
            if (type === 'eng') appData.words.englishTotal += amount;
            if (type === 'clss') appData.words.classicalTotal += amount;
            saveData();
        }

        function render() {
            // カウントダウン
            const now = new Date();
            const target = new Date(now.getFullYear() + (now.getMonth() > 2 ? 1 : 0), 2, 31);
            const diffDays = Math.ceil((target - now) / (1000 * 60 * 60 * 24));
            document.getElementById('countdown-badge').innerText = `3月末まで あと ${Math.max(0, diffDays)} 日`;

            const modeInfo = getTodayModeInfo();
            document.getElementById('mode-selector').value = appData.manualMode;
            document.getElementById('today-mode-banner').innerHTML = `<i class="fa-solid fa-bolt text-yellow-300 mr-1"></i> ${modeInfo.name} （目安：${modeInfo.hours}）`;

            // 今日の進捗からまるぷーキャラクター判定
            let todayStr = getTodayStr();
            let todayYMD = getTodayYMD();
            let todayDone = appData.dailyLog[todayYMD] || 0;
            
            let charaIcon = "💤🐕";
            let charaTitle = "今日のまるぷー（青・未達成）";
            let charaMsg = "まだ問題が進んでないよ！エンジンかけよう！";
            
            if (todayDone >= 15) {
                charaIcon = "✨🐕";
                charaTitle = "今日のまるぷー（金色・全クリア！）";
                charaMsg = "すばらしい！今日もうまくいったね！この調子！";
            } else if (todayDone >= 5) {
                charaIcon = "🥈🐕";
                charaTitle = "今日のまるぷー（銀色・半分達成）";
                charaMsg = "いいペース！あと少しで金色のまるぷーになれるよ！";
            }
            document.getElementById('chara-icon').innerText = charaIcon;
            document.getElementById('chara-title').innerText = charaTitle;
            document.getElementById('chara-message').innerText = charaMsg;

            // カレンダー描画（直近7日）
            let calHtml = "";
            for (let i = 6; i >= 0; i--) {
                let d = new Date();
                d.setDate(d.getDate() - i);
                let ymd = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                let count = appData.dailyLog[ymd] || 0;
                
                let icon = "💤";
                let borderColor = "border-slate-700 bg-slate-800/50 text-blue-400";
                if (count >= 15) { icon = "✨"; borderColor = "border-yellow-400 bg-yellow-500/20 text-yellow-300 font-bold"; }
                else if (count >= 5) { icon = "🥈"; borderColor = "border-slate-300 bg-slate-300/20 text-slate-200 font-bold"; }

                calHtml += `
                    <div class="p-1.5 rounded-xl border ${borderColor} text-center">
                        <div class="text-[10px] text-slate-400">${d.getMonth()+1}/${d.getDate()}</div>
                        <div class="text-lg my-0.5">${icon}</div>
                        <div class="text-[9px] text-slate-300">${count}問</div>
                    </div>
                `;
            }
            document.getElementById('calendar-container').innerHTML = calHtml;

            // メインコンテンツ
            const main = document.getElementById('main-content');
            main.innerHTML = '';

            if (currentTab === 'words') {
                main.innerHTML = `
                    <div class="bg-slate-900/90 border-2 border-pink-500/50 rounded-3xl p-5 shadow-xl space-y-4">
                        <h3 class="text-base font-black text-pink-300 flex items-center gap-2"><i class="fa-solid fa-book-open"></i> 英単語・古典単語カウンター</h3>
                        <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 space-y-2">
                            <div class="flex justify-between items-center"><span class="font-bold text-sm">英単語 累計</span><span class="text-xl font-black text-yellow-300">${appData.words.englishTotal} 語</span></div>
                            <div class="flex gap-2 pt-1">
                                <button onclick="addWords('eng', 10)" class="flex-1 bg-pink-600 hover:bg-pink-500 py-2 rounded-xl font-bold text-xs">+10語</button>
                                <button onclick="addWords('eng', 30)" class="flex-1 bg-purple-600 hover:bg-purple-500 py-2 rounded-xl font-bold text-xs">+30語</button>
                            </div>
                        </div>
                        <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 space-y-2">
                            <div class="flex justify-between items-center"><span class="font-bold text-sm">古典単語 累計</span><span class="text-xl font-black text-yellow-300">${appData.words.classicalTotal} 語</span></div>
                            <div class="flex gap-2 pt-1">
                                <button onclick="addWords('clss', 10)" class="flex-1 bg-pink-600 hover:bg-pink-500 py-2 rounded-xl font-bold text-xs">+10語</button>
                                <button onclick="addWords('clss', 20)" class="flex-1 bg-purple-600 hover:bg-purple-500 py-2 rounded-xl font-bold text-xs">+20語</button>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                const subData = appData.subjects[currentTab];
                let html = `<div class="space-y-4"><h3 class="text-xs font-bold text-purple-300 px-1">${subData.name} の問題一覧（タップで ○ ➔ △ ➔ ×）</h3>`;
                
                subData.categories.forEach(cat => {
                    let catCompleted = 0;
                    for (let i = 0; i < cat.count; i++) {
                        if ((subData.status[`${cat.id}_${i}`] || {st:0}).st === 2) catCompleted++;
                    }
                    const catPct = Math.round((catCompleted / cat.count) * 100);

                    html += `
                        <div class="bg-slate-900/90 border border-slate-800 rounded-3xl p-4 shadow-lg space-y-3">
                            <div class="flex justify-between items-center">
                                <h4 class="font-black text-sm text-slate-200">${cat.title}</h4>
                                <span class="text-xs font-bold text-indigo-300">${catCompleted}/${cat.count} (${catPct}%)</span>
                            </div>
                            <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                                <div class="bg-indigo-500 h-full rounded-full" style="width: ${catPct}%"></div>
                            </div>
                            <div class="grid grid-cols-6 gap-1.5 pt-1">
                    `;

                    for (let i = 0; i < cat.count; i++) {
                        const item = subData.status[`${cat.id}_${i}`] || { st: 0, date: "" };
                        let st = item.st;
                        let bg = "bg-slate-800 text-slate-400 border-slate-700";
                        let mark = i + 1;
                        if (st === 1) { bg = "bg-amber-500/20 text-amber-300 border-amber-500/50"; mark = (i+1) + "△"; }
                        if (st === 2) { bg = "bg-emerald-500 text-white border-emerald-400 font-bold shadow-sm"; mark = (i+1) + "〇"; }

                        html += `<button onclick="cycleStatus('${currentTab}', '${cat.id}', ${i})" class="py-1.5 px-1 rounded-xl border text-[11px] flex flex-col items-center justify-center transition active:scale-95 ${bg}">
                            <span class="font-bold">${i+1}</span>
                            <span class="text-[9px] opacity-80">${st === 2 ? '〇' : (st === 1 ? '△' : '-')}</span>
                            ${item.date ? `<span class="text-[8px] text-yellow-300">${item.date}</span>` : ''}
                        </button>`;
                    }

                    html += `</div></div>`;
                });

                html += `</div>`;
                main.innerHTML = html;
            }
        }

        render();
    </script>
</body>
</html>
