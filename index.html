                    <option value="school_noclub">⚡ 平日部活なし（5h）</option>

                    <option value="holiday_noclub">🌟 休日部活なし（7h）</option>
                    <option value="holiday_play">🎮 休日遊び（5h）</option>
                </select>
            </div>

            <!-- メダルステータス表示 -->

                <div>
                    <div id="medal-title" class="text-xs font-bold text-slate-500">本日の達成度メダル</div>
                    <div id="medal-message" class="text-sm font-black text-slate-800 mt-0.5">青メダル（50%未満）</div>
                    <div id="medal-progress-text" class="text-xs font-bold text-indigo-600 mt-1">今日のノルマ達成率: 0%</div>
                </div>
            </div>

            <div id="today-mode-banner" class="text-xs font-bold text-indigo-700 bg-indigo-50 p-2.5 rounded-xl border border-indigo-100 text-center">

            </div>
        </section>

        <section class="bg-white rounded-3xl p-5 shadow-sm border border-slate-200 space-y-3">

            const d = new Date();
            return `${d.getMonth() + 1}/${d.getDate()}`;
        }

        function getTodayYMD() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }

        function getTodayModeTarget() {
            const map = {
                school_club: 10,
                school_noclub: 20,
                holiday_club: 20,
                holiday_noclub: 30,
                holiday_play: 15
            };
            if (appData.manualMode && appData.manualMode !== 'auto') {
                return map[appData.manualMode] || 15;
            }
            const day = new Date().getDay();
            if (day === 2) return 20; // 火曜部活なし
            if (day === 6) return 20; // 土曜
            if (day === 0) return 30; // 日曜
            return 10; // 平日部活
        }

        function changeMode(val) {
            appData.manualMode = val;
            saveData();
        }

        function switchTab(tab) {
            currentTab = tab;
            ['math1a', 'math2bc', 'physics', 'chemistry', 'words'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if (t === tab) {
                    btn.className = "flex-1 py-2.5 px-3 rounded-2xl font-bold text-xs bg-indigo-600 text-white shadow-md transition whitespace-nowrap";
                } else {
                    btn.className = "flex-1 py-2.5 px-3 rounded-2xl font-bold text-xs bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 transition whitespace-nowrap";

            });
            render();
        }

        // ステータス切り替え: 0:未 -> 1:〇 -> 2:△ -> 3:× -> 0
        function cycleStatus(subjectKey, catId, pNum) {
            const key = `${catId}_${pNum}`;
            let currentObj = appData.subjects[subjectKey].status[key] || { st: 0, date: "" };
            let nextSt = (currentObj.st + 1) % 4;
            let todayStr = getTodayStr();

            appData.subjects[subjectKey].status[key] = {
                st: nextSt,
                date: nextSt > 0 ? todayStr : ""
            };

            saveData();
        }

        function addWords(type, amount) {
            if (type === 'eng') appData.words.englishTotal += amount;
            if (type === 'clss') appData.words.classicalTotal += amount;
            saveData();
        }

        function getDiffCircle(diff) {
            const circles = ["①", "②", "③", "④", "⑤"];
            return circles[diff - 1] || "①";
        }

        function render() {
            // カウントダウン
            const now = new Date();
            const target = new Date(now.getFullYear() + (now.getMonth() > 2 ? 1 : 0), 2, 31);
            const diffDays = Math.ceil((target - now) / (1000 * 60 * 60 * 24));
            document.getElementById('countdown-badge').innerText = `3月末まで あと ${Math.max(0, diffDays)} 日`;

            // モードと目標数
            const targetCount = getTodayModeTarget();
            document.getElementById('mode-selector').value = appData.manualMode;
            document.getElementById('today-mode-banner').innerText = `本日のノルマ目標: ${targetCount} 問完了`;

            // 今日の完了数計算 (〇または△または×で「着手済み」とするが、メダル達成率は〇と△を評価)
            let todayStr = getTodayStr();
            let todayDoneCount = 0;
            Object.keys(appData.subjects).forEach(sKey => {
                Object.values(appData.subjects[sKey].status).forEach(item => {
                    if ((item.st === 1 || item.st === 2 || item.st === 3) && item.date === todayStr) {
                        todayDoneCount++;
                    }
                });
            });

            // デイリーログ保存
            let todayYMD = getTodayYMD();
            appData.dailyLog[todayYMD] = { done: todayDoneCount, target: targetCount };

            // 達成率計算
            let pct = targetCount > 0 ? Math.round((todayDoneCount / targetCount) * 100) : 0;
            let medalIcon = "🔷";
            let medalTitle = "青メダル";
            let medalMsg = `目標達成率: ${pct}% （まだまだこれから！）`;

            if (pct >= 100) {
                medalIcon = "🥇";
                medalTitle = "金メダル！";
                medalMsg = `目標達成率: ${pct}% （完全コンプリート！）`;
            } else if (pct >= 70) {
                medalIcon = "🥈";
                medalTitle = "銀メダル！";
                medalMsg = `目標達成率: ${pct}% （素晴らしい集中力！）`;
            } else if (pct >= 50) {
                medalIcon = "🥉";
                medalTitle = "銅メダル！";
                medalMsg = `目標達成率: ${pct}% （折り返し地点到達！）`;
            }

            document.getElementById('medal-icon').innerText = medalIcon;
            document.getElementById('medal-title').innerText = `本日のメダル: ${medalTitle}`;
            document.getElementById('medal-message').innerText = medalMsg;
            document.getElementById('medal-progress-text').innerText = `本日こなした問題数: ${todayDoneCount} / ${targetCount} 問`;

            // カレンダー描画
            let calHtml = "";
            for (let i = 6; i >= 0; i--) {
                let d = new Date();
                d.setDate(d.getDate() - i);
                let ymd = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                let log = appData.dailyLog[ymd] || { done: 0, target: 15 };
                let dayPct = log.target > 0 ? Math.round((log.done / log.target) * 100) : 0;

                let icon = "🔷";
                let bgClass = "bg-slate-50 border-slate-200 text-slate-400";
                if (dayPct >= 100) { icon = "🥇"; bgClass = "bg-amber-50 border-amber-300 text-amber-700 font-bold"; }
                else if (dayPct >= 70) { icon = "🥈"; bgClass = "bg-slate-100 border-slate-300 text-slate-700 font-bold"; }
                else if (dayPct >= 50) { icon = "🥉"; bgClass = "bg-orange-50 border-orange-200 text-orange-700 font-bold"; }

                calHtml += `
                    <div class="p-1.5 rounded-2xl border ${bgClass} text-center shadow-2xs">
                        <div class="text-[10px] opacity-75">${d.getMonth()+1}/${d.getDate()}</div>
                        <div class="text-base my-0.5">${icon}</div>
                        <div class="text-[9px] font-bold">${log.done}問</div>
                    </div>
                `;
            }
            document.getElementById('calendar-container').innerHTML = calHtml;

            // メインコンテンツ
            const main = document.getElementById('main-content');
            main.innerHTML = '';

            if (currentTab === 'words') {
                main.innerHTML = `
                    <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-200 space-y-4">
                        <h3 class="text-base font-black text-indigo-600 flex items-center gap-2"><i class="fa-solid fa-book-open"></i> 英単語・古典単語カウンター</h3>
                        <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-2">
                            <div class="flex justify-between items-center"><span class="font-bold text-sm text-slate-700">英単語 累計マスター</span><span class="text-xl font-black text-indigo-600">${appData.words.englishTotal} 語</span></div>
                            <div class="flex gap-2 pt-1">
                                <button onclick="addWords('eng', 10)" class="flex-1 bg-indigo-600 text-white py-2 rounded-xl font-bold text-xs shadow-sm active:scale-95 transition">+10語</button>
                                <button onclick="addWords('eng', 30)" class="flex-1 bg-purple-600 text-white py-2 rounded-xl font-bold text-xs shadow-sm active:scale-95 transition">+30語</button>
                            </div>
                        </div>
                        <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-2">
                            <div class="flex justify-between items-center"><span class="font-bold text-sm text-slate-700">古典単語 累計マスター</span><span class="text-xl font-black text-purple-600">${appData.words.classicalTotal} 語</span></div>
                            <div class="flex gap-2 pt-1">
                                <button onclick="addWords('clss', 10)" class="flex-1 bg-indigo-600 text-white py-2 rounded-xl font-bold text-xs shadow-sm active:scale-95 transition">+10語</button>
                                <button onclick="addWords('clss', 20)" class="flex-1 bg-purple-600 text-white py-2 rounded-xl font-bold text-xs shadow-sm active:scale-95 transition">+20語</button>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                const subData = appData.subjects[currentTab];
                let html = `<div class="space-y-4"><h3 class="text-xs font-bold text-indigo-500 px-1">${subData.name} （タップで 〇 ➔ △ ➔ × ➔ リセット）</h3>`;

                subData.categories.forEach(cat => {
                    let catCompleted = 0;
                    cat.problems.forEach(p => {
                        if ((subData.status[`${cat.id}_${p.num}`] || {st:0}).st === 1) catCompleted++;
                    });
                    const catPct = Math.round((catCompleted / cat.problems.length) * 100);

                    html += `
                        <div class="bg-white rounded-3xl p-4 shadow-sm border border-slate-200 space-y-3">
                            <div class="flex justify-between items-center">
                                <h4 class="font-black text-sm text-slate-800">${cat.title}</h4>
                                <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2.5 py-0.5 rounded-full border border-indigo-100">${catCompleted}/${cat.problems.length} (${catPct}%)</span>
                            </div>
                            <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                                <div class="bg-indigo-500 h-full rounded-full transition-all duration-300" style="width: ${catPct}%"></div>
                            </div>
                            <div class="grid grid-cols-4 gap-2 pt-1">
                    `;

                    cat.problems.forEach(p => {
                        const item = subData.status[`${cat.id}_${p.num}`] || { st: 0, date: "" };
                        let st = item.st;
                        
                        // ステータスごとの色と記号設定
                        let bg = "bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100";
                        let mark = "";
                        
                        if (st === 1) { // 〇 完ペキ
                            bg = "bg-emerald-500 text-white border-emerald-400 font-bold shadow-xs";
                            mark = "<span class='text-xs font-black'>〇</span>";
                        } else if (st === 2) { // △ 要復習
                            bg = "bg-amber-400 text-white border-amber-300 font-bold shadow-xs";
                            mark = "<span class='text-xs font-black'>△</span>";
                        } else if (st === 3) { // × ダメだった
                            bg = "bg-rose-500 text-white border-rose-400 font-bold shadow-xs";
                            mark = "<span class='text-xs font-black'>×</span>";
                        }

                        html += `
                            <button onclick="cycleStatus('${currentTab}', '${cat.id}', ${p.num})" class="p-2 rounded-2xl border text-left flex flex-col justify-between transition active:scale-95 ${bg} min-h-[56px]">
                                <div class="flex justify-between items-center w-full">
                                    <span class="font-black text-xs">${p.num}</span>
                                    <span class="text-[10px] opacity-80">${getDiffCircle(p.diff)}</span>
                                </div>
                                <div class="flex justify-between items-end w-full mt-1">
                                    ${mark ? mark : '<span class="text-[9px] opacity-40">-</span>'}
                                    ${item.date ? `<span class="text-[8px] opacity-90 font-bold">${item.date}</span>` : ''}
                                </div>
                            </button>
                        `;
                    });

                    html += `</div></div>`;
                });

                html += `</div>`;
                main.innerHTML = html;
            }
        }

        render();
    </script>
</body>
</html>
